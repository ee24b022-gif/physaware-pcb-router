[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbroute"
version = "0.0.1"
description = "Physics-aware PCB routing research code"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
pcbroute-inspect = "pcbroute.kicad_io.__main__:main"
pcbroute-train = "pcbroute.ml.cli:train_main"
pcbroute-evaluate = "pcbroute.ml.cli:evaluate_main"
pcbroute-route-safe = "pcbroute.routing.safe_select:main"
pcbroute-train-congestion = "pcbroute.ml.cli:train_congestion_main"
pcbroute-predict-congestion = "pcbroute.ml.cli:predict_congestion_main"

[project.optional-dependencies]
dev = ["pytest", "networkx", "shapely"]
graph = ["networkx"]
ml = ["torch", "torch_geometric"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
