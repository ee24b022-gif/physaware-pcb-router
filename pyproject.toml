[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbroute"
version = "0.0.1"
description = "Physics-aware PCB routing research code"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
pcbroute-inspect = "pcbroute.kicad_io.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
